name: rushd
description: "RUSHD is a modern Islamic worship guidance and spiritual companion app designed to help users cultivate consistent daily habits, find inner clarity, and balance worldly life with spiritual devotion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  shared_preferences: ^2.5.3

  grpc: ^5.1.0
  protobuf: ^6.1.0

  geolocator: ^14.1.1
  flutter_timezone: ^5.1.1
  geocoding: ^5.0.0
  quran: 1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  protoc_plugin: ^25.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
